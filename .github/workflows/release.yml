name: Build & Release APK

on:
  # Creating a release in the GitHub UI also pushes its tag, so this single
  # trigger covers both "publish release in UI" and "git push <tag>".
  push:
    tags:
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease -Dorg.gradle.java.home=$JAVA_HOME

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK
        run: |
          VERSION=${{ github.event.inputs.version || github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'dev' }}
          mv ${{ steps.sign_app.outputs.signedReleaseFile }} app/build/outputs/apk/release/wakt-${VERSION}.apk

      - name: Locate release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          NOTES=".github/release-notes/${{ github.ref_name }}.md"
          if [ -f "$NOTES" ]; then echo "path=$NOTES" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: app/build/outputs/apk/release/wakt-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakt-apk
          path: app/build/outputs/apk/release/wakt-*.apk
          retention-days: 30
