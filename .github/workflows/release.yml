name: Build & Release APK

on:
  push:
    # A pushed version tag releases that tag. Creating a release in the GitHub
    # UI also pushes its tag, so that path is covered too.
    tags:
      - '[0-9]+.[0-9]+*'
    # A branch push whose head commit message contains "[release]" releases the
    # versionName from app/build.gradle.kts, moving that tag to the pushed commit.
    # A message containing "[ci]" only builds and signs (no release), as a
    # compile check for environments that cannot run Gradle locally.
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"; RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"; RELEASE=false
          else
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            case "$HEAD_MESSAGE" in *"[release]"*) RELEASE=true ;; *) RELEASE=false ;; esac
          fi
          echo "Version: $VERSION (release: $RELEASE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK and AAB
        run: ./gradlew assembleRelease bundleRelease -Dorg.gradle.java.home=$JAVA_HOME

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # The AAB is the Play Store upload; same key, so it is the Play upload key.
      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_bundle
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK and AAB
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mv ${{ steps.sign_app.outputs.signedReleaseFile }} app/build/outputs/apk/release/wakt-${VERSION}.apk
          mv ${{ steps.sign_bundle.outputs.signedReleaseFile }} app/build/outputs/bundle/release/wakt-${VERSION}.aab

      - name: Point version tag at this commit
        if: steps.version.outputs.release == 'true' && !startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag -f "$VERSION" "$GITHUB_SHA"
          git push --force origin "refs/tags/$VERSION"

      - name: Locate release notes
        id: notes
        if: steps.version.outputs.release == 'true'
        run: |
          NOTES=".github/release-notes/${{ steps.version.outputs.version }}.md"
          if [ -f "$NOTES" ]; then echo "path=$NOTES" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - name: Upload APK to Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            app/build/outputs/apk/release/wakt-*.apk
            app/build/outputs/bundle/release/wakt-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wakt-apk
          path: |
            app/build/outputs/apk/release/wakt-*.apk
            app/build/outputs/bundle/release/wakt-*.aab
          retention-days: 30
